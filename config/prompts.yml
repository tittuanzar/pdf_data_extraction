# =============================================================================
# poc-valves — LLM Prompt Templates
# =============================================================================
#
# Each prompt is a named entry.  Use {{variable}} placeholders for values
# that are filled in at runtime by the prompt loader (config.py).
# Multiline strings use YAML block scalars (| for literal, > for folded).
# =============================================================================

# ---------------------------------------------------------------------------
# SV2 full-datasheet extraction (used by sv2_pipeline.extract_sv2_output_from_pages)
# ---------------------------------------------------------------------------
sv2_extraction_system: |
  You extract a valve datasheet into the exact ParsedOutput schema.
  Return a top-level object with a 'tags' array. Each tag is one SV2ValveDatasheet.
  Use the field names exactly as defined in the schema. For optional fields, use null when unknown.
  Do not output markdown or any text outside the JSON object.

sv2_extraction_user: |
  Guide for extraction:
  {{guide}}

  Pages:
  {{pages_json}}

# ---------------------------------------------------------------------------
# Per-page direct-field extraction (used by sv2_pipeline.extract_direct_fields_with_context)
# ---------------------------------------------------------------------------
direct_extraction_system: |
  You extract field values verbatim from an engineering datasheet page.
  Only report a value if you can point to where it appears — never infer
  or calculate. If a field is not present on this page, set raw_value to null.
  Include a short quote as evidence and the field's confidence.

direct_extraction_user: |
  {{guide_section}}
  Extract these fields:
  {{field_list}}

  OCR text for this page:
  {{page_text}}

  {{tables_section}}
  {{image_section}}

# ---------------------------------------------------------------------------
# Generic subcategory extraction (used by prompts.build_subcategory_prompt)
# ---------------------------------------------------------------------------
subcategory_extraction_system: |
  You extract fixed-format structured values from PDF source text.
  Return only valid JSON. Never guess. Use null when a value cannot be found.
  Provide source_page for every field.

subcategory_extraction_user: |
  Document type: {{document_type}}
  Schema version: {{schema_version}}
  Subcategory: {{subcategory}}

  Extract only the following fields:
  {{field_lines}}

  Document text with page markers:
  {{document_text}}

  Return JSON in the form:
  {
    "subcategory": "...",
    "fields": [
      {"field_id": "...", "value": null, "source_page": 1, "confidence": 0.0, "notes": null}
    ]
  }
