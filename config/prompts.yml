# =============================================================================
# poc-valves — LLM Prompt Templates
# =============================================================================
#
# Nested structure: each extraction type has a group with system_prompt and
# user_prompt. Use {{variable}} placeholders for runtime substitution.
# Access via dot notation: get_prompt("tags_extraction.system_prompt")
# =============================================================================

# ---------------------------------------------------------------------------
# Tags extraction — SV2 full-datasheet extraction
# Used by sv2_pipeline.extract_sv2_output_from_pages
# ---------------------------------------------------------------------------
tags_extraction:
  system_prompt: |
    You extract a valve datasheet into the exact ParsedOutput schema.
    Return a top-level object with a 'tags' array. Each tag is one SV2ValveDatasheet.
    Use the field names exactly as defined in the schema. For optional fields, use null when unknown.
    Do not output markdown or any text outside the JSON object.

  user_prompt: |
    Guide for extraction:
    {{guide}}

    Pages:
    {{pages_json}}

# ---------------------------------------------------------------------------
# Data extraction — Per-page direct-field extraction
# Used by sv2_pipeline.extract_direct_fields_with_context
# ---------------------------------------------------------------------------
data_extraction:
  system_prompt: |
    You extract field values verbatim from an engineering datasheet page.
    Only report a value if you can point to where it appears — never infer
    or calculate. If a field is not present on this page, set raw_value to null.
    Include a short quote as evidence and the field's confidence.

  user_prompt: |
    {{guide_section}}
    Extract these fields:
    {{field_list}}

    OCR text for this page:
    {{page_text}}

    {{tables_section}}
    {{image_section}}

# ---------------------------------------------------------------------------
# Derived-field judgment — Phase 2 of the three-phase SV2 pipeline
# Used by sv2_pipeline.derive_judgment_fields_llm
# ---------------------------------------------------------------------------
derived_field_judgment:
  system_prompt: |
    You compute a small set of judgment-based derived fields for one valve tag,
    given its already-extracted direct field values, auxiliary raw source values,
    and per-field derivation logic. Do not invent values unsupported by the input
    or by standard engineering/vendor practice described in the logic. Use null
    when a field genuinely cannot be determined from the given data.

  user_prompt: |
    Already-extracted direct fields for this tag:
    {{direct_fields_json}}

    Auxiliary raw source values (verbatim from the enquiry, not final SV2 fields):
    {{auxiliary_fields_json}}

    Derive ONLY the following fields, following the stated logic for each:
    {{field_logic_block}}

# ---------------------------------------------------------------------------
# Subcategory extraction — Generic structured value extraction
# Used by pipeline/prompts.build_subcategory_prompt
# ---------------------------------------------------------------------------
subcategory_extraction:
  system_prompt: |
    You extract fixed-format structured values from PDF source text.
    Return only valid JSON. Never guess. Use null when a value cannot be found.
    Provide source_page for every field.

  user_prompt: |
    Document type: {{document_type}}
    Schema version: {{schema_version}}
    Subcategory: {{subcategory}}

    Extract only the following fields:
    {{field_lines}}

    Document text with page markers:
    {{document_text}}

    Return JSON in the form:
    {
      "subcategory": "...",
      "fields": [
        {"field_id": "...", "value": null, "source_page": 1, "confidence": 0.0, "notes": null}
      ]
    }

evaluation_tag_wise:
  system_prompt: |
    You are evaluating an AI extraction pipeline's output against ground-truth data in an Excel workbook.

    INPUT FORMAT
    Each sheet represents one tag/record. Each sheet has these columns:
    - Sl.No: row identifier
    - Feature name: the field being extracted
    - Extracted feature value: what the extraction pipeline produced
    - Ground Truth: the correct/reference value

    TASK
    For every row on every sheet, compare "Extracted feature value" against "Ground Truth" and classify the match as one of:

    1. EXACT — identical value/meaning. Ignore leading/trailing whitespace, line breaks vs spaces, and trivial symbol variants (e.g. ° vs º, "2" vs "²" as a unit exponent).

    2. CLOSE — same underlying value or meaning, but differs in:
      - formatting/notation (e.g. "3 in STD" vs "3 in/STD", "0.2" vs "0.20 kgf/cm²")
      - abbreviation or paraphrase that preserves meaning (e.g. "FTC (Flow-To-Close)" vs "Flow to close")
      - extra/missing qualifier text that doesn't change the core value (e.g. "12 kgf/cm²-g" vs "12 kgf/cm² (Tag1)")
      - rounding or unit-prefix differences that clearly refer to the same quantity

    3. WRONG / MISSING — one of:
      - the two values contradict each other or refer to materially different things (e.g. a different material grade, a different numeric value)
      - one side is blank/None while the other has a real, substantive value
      - the extraction says "NOT EXTRACTED" or is empty while ground truth has a value (or vice versa)

    RULE: If BOTH the extracted value and ground truth are blank/None for a field, count that as EXACT (correctly and consistently blank), not as missing.

    OUTPUT
    1. A per-sheet count of Exact / Close / Wrong, plus total fields per sheet.
    2. Two accuracy metrics per sheet and overall:
      - Exact-match accuracy = Exact / Total
      - Exact+Close accuracy = (Exact + Close) / Total
    3. A short list of the systematic/recurring issues you noticed (e.g. a field that's wrong across all tags, or a field where ground truth appears incomplete rather than the extraction being wrong).
    4. Produce an annotated copy of the workbook with a new "Match Type" column (color-coded: green=Exact, yellow=Close, red=Wrong) on each sheet, plus a Summary sheet with the counts/percentages as live formulas.

    If given a revised version of the file later (updated ground truth or updated extraction), only report what changed since the previous run and recompute the accuracy deltas — don't redo the full narrative from scratch.

  user_prompt: |
    Document type: {{document_type}}
    Schema version: {{schema_version}}
    Subcategory: {{subcategory}}

    Evaluate only the following fields:
    {{field_lines}}

    Document text with page markers:
    {{document_text}}

    Return JSON in the form:
    {
      "evaluation": [
        {"field_id": "...", "value": null, "source_page": 1, "confidence": 0.0, "notes": null}
      ]
    }
