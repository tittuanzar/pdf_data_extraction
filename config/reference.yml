document_extraction_fields:
- id: 1
  sv2_field_name: Tag No
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Tag No.
    example_value: TAG-001 | TAG-002 | TAG-003
  logic: Copy tag number verbatim from the tag number field at the top of the Enquiry DS.
  example_output: TAG-001 | TAG-002 | TAG-003
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Tag Number; Instrument Tag; Tag ID; FV Tag
  similar_values_reference: FV-XXXX; CV-XXXX; HCV-XXXX
  output_spec:
    sv2_spec_field_name: Tag No
  notes: 'Tag number must match the P&ID reference. Format: Plant-Instrument-Number.'
- id: 2
  sv2_field_name: Service
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Service
    example_value: COOLING WATER TO HX-01 (PUMP P-01A/B) | LP STEAM TO E-01 PREHEATER | PLANT AIR TO T-01 AERATION SYSTEM
  logic: Copy service description verbatim from the Service field of the Enquiry DS.
  example_output: COOLING WATER TO HX-01 (PUMP P-01A/B) | LP STEAM TO E-01 PREHEATER | PLANT AIR TO T-01 AERATION SYSTEM
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Service Description; Valve Duty; Application
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Service
  notes: May include equipment tag number in parentheses. Carry forward exactly as written.
- id: 3
  sv2_field_name: Fluid Name
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Process Fluid
    example_value: Water | Steam | Plant Air
  logic: Copy fluid name from the Process Fluid field of the Enquiry DS.
  example_output: Water | Steam | Air
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Process Fluid; Fluid; Medium; Service Fluid
  similar_values_reference: Water; Condensate; Steam; LP Steam; Plant Air; Nitrogen; Propylene
  output_spec:
    sv2_spec_field_name: Fluid Name
  notes: Fluid name determines the sizing equation set (liquid, steam, or gas). Cross-check with the Upstream Condition field for consistency.
- id: 4
  sv2_field_name: Fluid Phase
  extraction_type: derived
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Upstream Condition
    example_value: Water | Steam | Gas/Vapor
  logic: 'Map the Upstream Condition value to Sv2 dropdown: Water/Liquid/Condensate → Liquid; Steam/LP Steam/HP Steam → Steam; Gas/Vapor/Air/Nitrogen → Gas.'
  example_output: Liquid | Steam | Gas
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: State; Phase; Fluid State; Condition
  similar_values_reference: Liquid; Vapour; Gas; Steam; Two- Phase
  output_spec:
    sv2_spec_field_name: Fluid Phase
  notes: This selection determines the entire sizing equation path in Solutioneer. An incorrect phase
    will give a completely wrong Cv result.
- id: 5
  sv2_field_name: Inlet Pipe Size/Sch
  extraction_type: direct
  requirement: mandatory
  unit: in / Schedule
  source:
    enquiry_field_name: Line Size and Schedule — Inlet
    example_value: 4 in STD | 10 in XS | 6 in STD
  logic: Extract inlet size and schedule from the Line Size and Schedule (Inlet) field. Parse leading number as nominal size; schedule follows (STD, XS, 40S etc.)
  example_output: 4 in/STD | 10 in/XS | 6 in/STD
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Inlet Line Size; Upstream Line Size; Inlet Pipe Class; NPS
  similar_values_reference: 1 in; 2 in; 3 in; 4 in; 6 in; 8 in; 12 in; STD; XS; SCH 40; SCH 80
  output_spec:
    sv2_spec_field_name: Inlet Pipe Size/Sch
  notes: Line size also embedded in the Line Number tag (e.g. '3"-CL-1201...' → 3 in). Use the Line Size and Schedule field as primary source.
- id: 6
  sv2_field_name: Outlet Pipe Size/Sch
  extraction_type: direct
  requirement: mandatory
  unit: in / Schedule
  source:
    enquiry_field_name: Line Size and Schedule — Outlet
    example_value: 4 in STD | 10 in XS | 6 in STD
  logic: Extract outlet size and schedule from the Line Size and Schedule (Outlet) field. Usually same as inlet unless expander is fitted.
  example_output: 4 in/STD | 10 in/XS | 6 in/STD
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Outlet Line Size; Downstream Pipe Size
  similar_values_reference: Same as inlet in most cases
  output_spec:
    sv2_spec_field_name: Outlet Pipe Size/Sch
  notes: If Outlet size differs from Inlet size, an expander/reducer is required. Flag for engineer review.
- id: 7
  sv2_field_name: Design Pressure (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Design Pressure / Temperature
    example_value: 12 kgf/cm²-g | 10 kgf/cm²-g | 12 kgf/cm²-g
  logic: Extract maximum design pressure from the Design Pressure / Temperature field of the Enquiry DS. This is the higher of the two values stated.
  example_output: 12 kgf/cm²-g | 10 kgf/cm²-g | 12 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Design Pressure; Max Design Pressure; DP MAX; MAWP
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Design Temp(MAX/MIN)
  notes: Design pressure determines the ASME pressure class (150#, 300#, 600# etc.) per ASME B16.34 P-
    T tables.
- id: 8
  sv2_field_name: Design Pressure (MIN)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Design Pressure / Temperature
    example_value: FV kgf/cm²-g | FV kgf/cm²-g | — (not stated)
  logic: Extract minimum design pressure from the Design Pressure / Temperature field. FV = Full Vacuum = -1.033 kgf/cm²-a (or 0 absolute). Carry as 'FV' text if shown.
  example_output: FV | FV | —
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Min Design Pressure; Full Vacuum; FV; MDMP
  similar_values_reference: FV; Full Vacuum; -1 barg; Vacuum
  output_spec:
    sv2_spec_field_name: Design Pressure(MAX/MIN)
  notes: FV = Full Vacuum as design condition. See DS Page 2 process notes. Confirm with engineer before
    populating Sv2.
- id: 9
  sv2_field_name: Design Temp (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: °C
  source:
    enquiry_field_name: Design Pressure / Temperature
    example_value: 90 °C | 180 °C | 45 °C
  logic: Extract maximum design temperature from the Design Pressure / Temperature field of the Enquiry DS.
  example_output: 90 °C | 180 °C | 45 °C
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: Design Temperature; Max Temp; MADT; MDMT (max)
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Design Temp(MAX/MIN)
  notes: Determines material grade selection (e.g. need for low-temp grades below -29°C, or high-temp
    grades above 230°C).
- id: 10
  sv2_field_name: Design Temp (MIN) / MDMT
  extraction_type: derived
  requirement: mandatory
  unit: °C
  source:
    enquiry_field_name: Ambient Temperature / Process Notes Page 2
    example_value: 0 °C (MDMT from process notes, all tags)
  logic: MDMT (Minimum Design Metal Temperature) is stated in the DS Page 2 Process Notes. Not the same as ambient temperature. Extract from the notes text.
  example_output: 0 °C | 0 °C | 0 °C
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: MDMT; Min Design Metal Temperature; Low Temp; Cold Design Temp
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Design Temp(MAX/MIN)
  notes: MDMT drives low-temperature material requirements (impact testing). Located in the Page 2 Process Notes, not the Ambient Temperature field.
- id: 11
  sv2_field_name: Flow Rate (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: Am³/h | kg/h | Nm³/h
  source:
    enquiry_field_name: Flow Rate @ Max Flow
    example_value: 15 | 7000 | 3000
  logic: Extract flow rate value from the '@ Max Flow' column of the Flow Rate field. Preserve units exactly as stated.
  example_output: 15 m³/h | 7000 kg/h | 3000 Nm³/h
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Maximum Flow Rate; Flow Max; Qmax; Mass Flow Max
  similar_values_reference: m³/h; Am³/h; Nm³/h; kg/h; kg/s; lb/h
  output_spec:
    sv2_spec_field_name: Flow rate
  notes: Units vary between liquid (Am³/h or kg/h) and gas (Nm³/h or kg/h). Check the units column in the flow rate table header.
- id: 12
  sv2_field_name: Flow Rate (NOR)
  extraction_type: direct
  requirement: mandatory
  unit: Am³/h | kg/h | Nm³/h
  source:
    enquiry_field_name: Flow Rate @ Norm Flow
    example_value: 12 | 6000 | 2700
  logic: Extract flow rate value from the '@ Norm. Flow' column of the Flow Rate field.
  example_output: 12 m³/h | 6000 kg/h | 2700 Nm³/h
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Normal Flow Rate; Nominal Flow; Design Flow; Qnorm
  similar_values_reference: Same as Max units
  output_spec:
    sv2_spec_field_name: Flow rate
  notes: Normal (design) flow is the primary sizing case. Cv at Normal flow determines valve % travel
    target.
- id: 13
  sv2_field_name: Flow Rate (MIN)
  extraction_type: direct
  requirement: mandatory
  unit: Am³/h | kg/h | Nm³/h
  source:
    enquiry_field_name: Flow Rate @ Min Flow
    example_value: 8 | 3000 | 2400
  logic: Extract flow rate value from the '@ Min. Flow' column of the Flow Rate field.
  example_output: 8 m³/h | 3000 kg/h | 2400 Nm³/h
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Minimum Flow Rate; Qmin; Low Flow
  similar_values_reference: Same as Max units
  output_spec:
    sv2_spec_field_name: Flow rate
  notes: Minimum flow case checks that valve does not throttle too close to closed position (< 10% travel).
- id: 14
  sv2_field_name: Inlet Pressure (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Inlet Pressure @ Max Flow
    example_value: 8.0 | 4.0 | 5.0
  logic: Extract inlet pressure from the '@ Max Flow' column of the Inlet Pressure field.
  example_output: 8.0 kgf/cm²-g | 4.0 kgf/cm²-g | 5.0 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P1 Max; Upstream Pressure Max; Inlet P Max
  similar_values_reference: bar-g; kPa-g; psi-g; kgf/cm²-g; kgf/cm²-a
  output_spec:
    sv2_spec_field_name: Inlet Press.
  notes: Check gauge vs absolute units. Enquiry DS uses kgf/cm²-g (gauge). If absolute ('a'), subtract
    1.033 to convert to gauge.
- id: 15
  sv2_field_name: Inlet Pressure (NOR)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Inlet Pressure @ Norm Flow
    example_value: 8.0 | 4.0 | 5.0
  logic: Extract inlet pressure from the '@ Norm. Flow' column of the Inlet Pressure field.
  example_output: 8.0 kgf/cm²-g | 4.0 kgf/cm²-g | 5.0 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P1 Norm; Upstream Pressure Normal; Inlet P Normal
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Inlet Press.
- id: 16
  sv2_field_name: Inlet Pressure (MIN)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Inlet Pressure @ Min Flow
    example_value: 8.1 | 4.0 | 5.1
  logic: Extract inlet pressure from the '@ Min. Flow' column of the Inlet Pressure field.
  example_output: 8.1 kgf/cm²-g | 4.0 kgf/cm²-g | 5.1 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P1 Min; Upstream Pressure Min
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Inlet Press.
- id: 17
  sv2_field_name: Outlet Pressure (MAX)
  extraction_type: derived
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Not directly stated — derived from Inlet Pressure and Pressure Drop
    example_value: 'Calculated: 8.0 - 7.0 = 1.0 | 4.0 - 0.4 = 3.6 | 5.0 - 2.0 = 3.0'
  logic: Outlet Pressure = Inlet Pressure − Pressure Drop for each case. Sv2 requires explicit outlet pressure.
  example_output: 1.0 kgf/cm²-g | 3.6 kgf/cm²-g | 3.0 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P2 Max; Downstream Pressure Max; Back Pressure Max
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Outlet Press.
  notes: If result is negative, check whether Enquiry DS uses absolute rather than gauge pressure. Flag
    for engineer confirmation.
- id: 18
  sv2_field_name: Outlet Pressure (NOR)
  extraction_type: derived
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Not directly stated — derived from Inlet Pressure and Pressure Drop
    example_value: 'Calculated: 8.0 - 7.1 = 0.9 | 4.0 - 0.41 = 3.59 | 5.0 - 2.0 = 3.0'
  logic: Outlet Pressure NOR = Inlet Pressure NOR − Pressure Drop NOR.
  example_output: 0.9 kgf/cm²-g | 3.59 kgf/cm²-g | 3.0 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P2 Norm; Downstream Pressure Normal
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Outlet Press.
- id: 19
  sv2_field_name: Outlet Pressure (MIN)
  extraction_type: derived
  requirement: mandatory
  unit: kgf/cm²-g
  source:
    enquiry_field_name: Not directly stated — derived from Inlet Pressure and Pressure Drop
    example_value: 'Calculated: 8.1 - 7.2 = 0.9 | 4.0 - 0.42 = 3.58 | 5.1 - 2.1 = 3.0'
  logic: Outlet Pressure MIN = Inlet Pressure MIN − Pressure Drop MIN.
  example_output: 0.9 kgf/cm²-g | 3.58 kgf/cm²-g | 3.0 kgf/cm²-g
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: P2 Min; Downstream Pressure Min
  similar_values_reference: —
  output_spec:
    sv2_spec_field_name: Outlet Press.
- id: 20
  sv2_field_name: Pressure Drop (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²
  source:
    enquiry_field_name: Pressure Drop @ Max Flow
    example_value: 7.0 | 0.4 | 2.0
  logic: Extract pressure drop from the '@ Max Flow' column of the Pressure Drop field.
  example_output: 7.0 kgf/cm² | 0.4 kgf/cm² | 2.0 kgf/cm²
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: dP Max; Delta P Max; Differential Pressure Max; ΔP
  similar_values_reference: bar; kPa; psi; kgf/cm²
  output_spec:
    sv2_spec_field_name: Pressure drop
  notes: Pressure drop at max flow gives the largest Cv but may not be the most critical case for control.
- id: 21
  sv2_field_name: Pressure Drop (NOR)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²
  source:
    enquiry_field_name: Pressure Drop @ Norm Flow
    example_value: 7.1 | 0.41 | 2.0
  logic: Extract pressure drop from the '@ Norm. Flow' column of the Pressure Drop field.
  example_output: 7.1 kgf/cm² | 0.41 kgf/cm² | 2.0 kgf/cm²
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: dP Norm; Delta P Normal
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Pressure drop
- id: 22
  sv2_field_name: Pressure Drop (MIN)
  extraction_type: direct
  requirement: mandatory
  unit: kgf/cm²
  source:
    enquiry_field_name: Pressure Drop @ Min Flow
    example_value: 7.2 | 0.42 | 2.1
  logic: Extract pressure drop from the '@ Min. Flow' column of the Pressure Drop field.
  example_output: 7.2 kgf/cm² | 0.42 kgf/cm² | 2.1 kgf/cm²
  dependencies:
    service_dependent: false
    sector_dependent: false
  aliases: dP Min; Delta P Min
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Pressure drop
- id: 23
  sv2_field_name: Temperature (MAX)
  extraction_type: direct
  requirement: mandatory
  unit: °C
  source:
    enquiry_field_name: Inlet Temperature @ Max Flow
    example_value: 90 | 180 | 45
  logic: Extract temperature from the '@ Max Flow' column of the Inlet Temperature field.
  example_output: 90 °C | 180 °C | 45 °C
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: T Max; Process Temperature Max; Fluid Temp Max
  similar_values_reference: °C; °F; K
  output_spec:
    sv2_spec_field_name: Temperature
  notes: High temperature affects packing selection, bonnet type, and body material grade.
- id: 24
  sv2_field_name: Temperature (NOR)
  extraction_type: direct
  requirement: mandatory
  unit: °C
  source:
    enquiry_field_name: Inlet Temperature @ Norm Flow
    example_value: 90 | 180 | 45
  logic: Extract temperature from the '@ Norm. Flow' column of the Inlet Temperature field.
  example_output: 90 °C | 180 °C | 45 °C
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: T Norm; Process Temperature Normal
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Temperature
- id: 25
  sv2_field_name: Temperature (MIN)
  extraction_type: direct
  requirement: mandatory
  unit: °C
  source:
    enquiry_field_name: Inlet Temperature @ Min Flow
    example_value: 90 | 180 | 45
  logic: Extract temperature from the '@ Min. Flow' column of the Inlet Temperature field.
  example_output: 90 °C | 180 °C | 45 °C
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: T Min; Process Temperature Min
  similar_values_reference: Same as Max
  output_spec:
    sv2_spec_field_name: Temperature
- id: 26
  sv2_field_name: Specific Gravity / Molecular Weight
  extraction_type: derived
  requirement: mandatory
  unit: kg/m³ or dimensionl ess or g/mol
  source:
    enquiry_field_name: Inlet Density / Specific Gravity / Molecular Mass
    example_value: 950 kg/m³ (SG=0.95) | — (steam) | 28.96 (MW)
  logic: 'Liquid service: the density field gives density in kg/m3 → divide by 1000 to get SG (e.g. 950/1000 = 0.95). Gas service: the field gives MW in g/mol (e.g. 28.96 for air). Steam service: leave blank; Sv2 uses steam tables.'
  example_output: SG = 0.95 | Blank (steam) | MW = 28.96 g/mol
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Spec. Gravity; SG; Specific Gravity; Molecular Weight; MW; Density; Relative Density
  similar_values_reference: kg/m³; kg/L; g/cm³; dimensionless SG; g/mol
  output_spec:
    sv2_spec_field_name: Spec. Gravity
  notes: Units must be verified. If the density field header says 'kg/m³' for a liquid, divide by 1000 for SG. If already dimensionless, use directly.
- id: 27
  sv2_field_name: Viscosity
  extraction_type: direct
  requirement: mandatory
  unit: cP
  source:
    enquiry_field_name: Inlet Viscosity
    example_value: 0.85 | 0.015 | 0.018
  logic: Copy viscosity value from the Viscosity field of the Enquiry DS.
  example_output: 0.85 cP | 0.015 cP | 0.018 cP
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Viscosity; Dynamic Viscosity; Kinematic Viscosity; μ; Centipoise
  similar_values_reference: 'cP; mPa·s; cSt (note: cSt ≠ cP for density ≠ 1)'
  output_spec:
    sv2_spec_field_name: Viscosity
  notes: 'Viscosity affects Fp correction factor for high- viscosity liquids. If in cSt, convert: cP =
    cSt × SG.'
- id: 28
  sv2_field_name: Compressibility Factor (Z)
  extraction_type: direct
  requirement: conditional
  unit: Dimensionl ess
  source:
    enquiry_field_name: Inlet Compressibility Factor
    example_value: — (liquid; not applicable) | — (steam) | 0.998
  logic: Extract Z from the Compressibility Factor field. Applicable for gas/vapour only. Leave blank for liquid and steam (Sv2 applies steam tables).
  example_output: N/A (liquid) | N/A (steam) | 0.998
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Z Factor; Gas Compressibility; Compressibility; Z
  similar_values_reference: 0.95 to 1.05 typical range
  output_spec:
    sv2_spec_field_name: Z
  notes: For ideal gases Z = 1.0. If the Compressibility Factor field is blank for a gas service, use Z = 1.0 as default.
- id: 29
  sv2_field_name: Specific Heats Ratio (K)
  extraction_type: direct
  requirement: conditional
  unit: Dimensionl ess
  source:
    enquiry_field_name: Inlet Specific Heats Ratio
    example_value: — (liquid; not applicable) | 1.30 (steam) | 1.4 (air)
  logic: Extract K from the Specific Heats Ratio field. Applicable for gas and steam only. Leave blank for liquid services.
  example_output: N/A (liquid) | 1.30 | 1.4
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Isentropic Exponent; Cp/Cv; Gamma; K; Specific Heat Ratio
  similar_values_reference: Air = 1.4; Steam ≈ 1.3; Nitrogen = 1.4; CO2 = 1.3
  output_spec:
    sv2_spec_field_name: K
  notes: K affects the choked flow (critical pressure drop ratio) calculation. If not stated for a gas
    service, use 1.4 as conservative default for diatomic gases.
- id: 30
  sv2_field_name: Vapour Pressure
  extraction_type: direct
  requirement: conditional
  unit: kgf/cm²-a
  source:
    enquiry_field_name: Inlet Vapour Pressure
    example_value: 0.90 kgf/cm²-a | — (steam; not applicable) | — (gas; not applicable)
  logic: Extract vapour pressure from the Vapour Pressure field. Applicable for liquid services only. Used to check cavitation and flashing.
  example_output: 0.90 kgf/cm²-a | N/A | N/A
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Pv; Vapour Pressure; Psat; Liquid Vapour Pressure
  similar_values_reference: kgf/cm²-a; bar-a; psia; kPa-a
  output_spec:
    sv2_spec_field_name: Vapour Press.
  notes: Must be in absolute pressure units. If given as gauge, add 1.033 kgf/cm² to convert to absolute.
- id: 31
  sv2_field_name: Valve Type
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Body Type
    example_value: Single Seat Globe | Single Seat Globe | Single Seat Globe
  logic: Copy body type from the Body Type field of the Enquiry DS verbatim.
  example_output: Single Seat Globe | Single Seat Globe | Single Seat Globe
  dependencies:
    service_dependent: true
    sector_dependent: false
  aliases: Body Type; Valve Type; Valve Body Style; Body Style
  similar_values_reference: Single Seated Globe; Double Seated Globe; Butterfly; Ball; Angle; Y-Pattern
  output_spec:
    sv2_spec_field_name: Type
  notes: Valve type is always stated by the customer in this format. Do not leave for engineer to determine.
- id: 32
  sv2_field_name: Body Material
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
    enquiry_field_name: Body Material
    example_value: F.S. ASTM A105 Normalized | C.S. ASTM A216 WCB | C.S. ASTM A216 WCB
  logic: Copy body material specification verbatim from the Body Material field of the Enquiry DS. This is fully stated by the customer.
  example_output: F.S. ASTM A105 Normalized | ASTM A216 Gr. WCC | ASTM A216 Gr. WCC
  dependencies:
    service_dependent: true
    sector_dependent: true
  aliases: Body Material; Body MOC; Body Grade; Pressure Boundary Material
  similar_values_reference: A105; A216 WCB; A216 WCC; A351 CF8M; A351 CF3M; A182 F316
  output_spec:
    sv2_spec_field_name: Body Material
  notes: 'Note: Enquiry DS says ''A216 WCB'' while KSB MIL DS shows ''A216 Gr. WCC'' — verify with engineer.
    WCB and WCC are different grades. Do not silently change.'
- id: 33
  sv2_field_name: Bonnet Type
  extraction_type: direct
  requirement: mandatory
  unit: —
  source:
