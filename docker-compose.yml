services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .env:/app/.env
      - ./:/app
    command: ["uv", "run", "uvicorn", "poc_valves.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
